<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEXUS SNAKE</title>
<meta name="theme-color" content="#07080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;
  --bg2:#0c0f1c;
  --gold:#e8c37a;
  --gold2:#f7e3b0;
  --ice:#7fd8ff;
  --txt:#e9edf7;
  --dim:#8b93ab;
  --panel:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(900px 600px at 15% -10%, rgba(127,216,255,.13), transparent 60%),
    radial-gradient(800px 600px at 90% 110%, rgba(232,195,122,.13), transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg2) 55%,#05060c);
  color:var(--txt);
  font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;
  user-select:none;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#snow i{
  position:absolute;top:-10px;width:4px;height:4px;border-radius:50%;
  background:rgba(180,230,255,.75);box-shadow:0 0 6px rgba(127,216,255,.9);
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-20px) translateX(0);opacity:0}
  10%{opacity:.9}
  100%{transform:translateY(105vh) translateX(30px);opacity:0}
}
.app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));
  gap:8px;
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 12px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .snake{
  font-size:22px;filter:drop-shadow(0 0 10px rgba(127,216,255,.8));
  animation:float 3.2s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.brand h1{
  margin:0;font-family:'Playfair Display',serif;font-size:17px;letter-spacing:.5px;
  background:linear-gradient(92deg,var(--gold2),var(--gold) 40%,var(--ice));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;
}
.brand small{display:block;font-size:9px;color:var(--dim);letter-spacing:2px;font-weight:600}
.hud{display:flex;gap:6px;align-items:center}
.stat{
  min-width:56px;text-align:center;padding:5px 9px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);
}
.stat b{display:block;font-size:15px;line-height:1.1;color:var(--gold2);font-weight:800}
.stat span{font-size:8.5px;color:var(--dim);letter-spacing:1.2px;font-weight:600}
.iconbtn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font-size:16px;cursor:pointer;
  display:grid;place-items:center;transition:.18s;
}
.iconbtn:active{transform:scale(.92);background:rgba(232,195,122,.16)}
main{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#boardWrap{position:relative;display:grid;place-items:center}
canvas{
  display:block;border-radius:20px;
  background:linear-gradient(160deg,rgba(12,16,30,.96),rgba(6,8,16,.98));
  border:1px solid rgba(232,195,122,.22);
  box-shadow:0 0 0 1px rgba(127,216,255,.07) inset,0 20px 60px rgba(0,0,0,.6),0 0 60px rgba(127,216,255,.08);
  touch-action:none;
}
.overlay{
  position:absolute;inset:0;display:none;place-items:center;
  background:rgba(5,6,12,.72);backdrop-filter:blur(9px);border-radius:20px;
  padding:14px;z-index:5;
}
.overlay.show{display:grid;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov-card{
  width:100%;max-width:330px;text-align:center;
  padding:20px 18px;border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  border:1px solid rgba(232,195,122,.28);
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  animation:pop .3s cubic-bezier(.2,1.3,.5,1);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.ov-logo{font-size:44px;filter:drop-shadow(0 0 18px rgba(127,216,255,.85));margin-bottom:4px}
.ov-card h1{
  margin:0 0 6px;font-family:'Playfair Display',serif;font-size:26px;letter-spacing:1px;
  background:linear-gradient(92deg,var(--gold2),var(--gold) 45%,var(--ice));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ov-card h1 span{font-style:italic}
.ov-sub{margin:0 0 14px;font-size:12.5px;color:var(--dim);line-height:1.5}
.ov-row{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.chip{
  padding:8px 13px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);transition:.18s;
}
.chip.on{
  color:#0a0c14;border-color:transparent;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 6px 18px rgba(232,195,122,.35);
}
.chip:active{transform:scale(.95)}
.btn-primary{
  width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
  font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;letter-spacing:.5px;color:#0a0c14;
  background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#d9a94f);
  box-shadow:0 12px 30px rgba(232,195,122,.35);
  transition:.18s;
}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{
  width:100%;padding:12px;border-radius:14px;cursor:pointer;margin-top:8px;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);
  font-family:'Manrope',sans-serif;font-size:13.5px;font-weight:700;transition:.18s;
}
.btn-ghost:active{transform:scale(.97);background:rgba(255,255,255,.1)}
.ov-hint{margin:12px 0 0;font-size:10.5px;color:#6f7791;line-height:1.5}
.big-score{font-family:'Playfair Display',serif;font-size:40px;color:var(--gold2);line-height:1;margin:6px 0}
.rec{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800;
  color:#0a0c14;background:linear-gradient(135deg,var(--gold2),var(--gold));animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
footer{display:flex;justify-content:center;align-items:center;gap:14px;padding-bottom:2px}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px}
.pad button{
  border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  color:var(--gold2);font-size:19px;cursor:pointer;transition:.12s;
  display:grid;place-items:center;
}
.pad button:active{transform:scale(.9);background:rgba(232,195,122,.22);color:#fff}
.pad .up{grid-area:1/2}.pad .left{grid-area:2/1}.pad .right{grid-area:2/3}.pad .down{grid-area:3/2}
.pad .mid{grid-area:2/2;border:none;background:transparent;font-size:22px;color:var(--ice)}
@media (max-height:640px){
  .pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
  .brand h1{font-size:15px}
}
</style>
</head>
<body>
<div id="snow"></div>

<div class="app">
  <header>
    <div class="brand">
      <div class="snake">🐍</div>
      <div>
        <h1>NEXUS SNAKE</h1>
        <small>PREMIUM · v1</small>
      </div>
    </div>
    <div class="hud">
      <div class="stat"><b id="hScore">0</b><span>ОЧКИ</span></div>
      <div class="stat"><b id="hBest">0</b><span>РЕКОРД</span></div>
      <button class="iconbtn" id="btnPause" title="Пауза">⏸</button>
    </div>
  </header>

  <main>
    <div id="boardWrap">
      <canvas id="game"></canvas>
      <div class="overlay" id="ov"></div>
    </div>
  </main>

  <footer>
    <div class="pad">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="mid" id="btnMid">⏯</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down" data-dir="down">▼</button>
    </div>
  </footer>
</div>

<script>
(function(){
'use strict';

/* ---------- снежинки ---------- */
(function snow(){
  var box=document.getElementById('snow');
  for(var i=0;i<26;i++){
    var s=document.createElement('i');
    var sz=(2+Math.random()*3.5).toFixed(1);
    s.style.left=(Math.random()*100)+'%';
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.animationDuration=(7+Math.random()*10).toFixed(1)+'s';
    s.style.animationDelay=(-Math.random()*12).toFixed(1)+'s';
    s.style.opacity=(0.25+Math.random()*0.55).toFixed(2);
    box.appendChild(s);
  }
})();

/* ---------- ядро ---------- */
var COLS=20, ROWS=20;
var cvs=document.getElementById('game');
var ctx=cvs.getContext('2d');
var ov=document.getElementById('ov');
var boardWrap=document.getElementById('boardWrap');
var CELL=20, DPR=1;

var snake=[], dir={x:1,y:0}, pending=[];
var food=null, golden=null;
var score=0, best=parseInt(localStorage.getItem('ns_best')||'0',10)||0;
var state='menu';
var speed=140, acc=0, lastT=0, particles=[], eaten=0;
var wrapMode = localStorage.getItem('ns_mode')==='portal';
var soundOn  = localStorage.getItem('ns_sound')!=='0';
var rafId=null;

/* ---------- звук ---------- */
var actx=null;
function beep(freq,dur,type,vol){
  if(!soundOn) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    var t=actx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.07,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ---------- размеры ---------- */
function resize(){
  var w=boardWrap.clientWidth, h=boardWrap.clientHeight;
  var size=Math.max(180, Math.floor(Math.min(w,h))-6);
  DPR=Math.min(2, window.devicePixelRatio||1);
  cvs.style.width=size+'px'; cvs.style.height=size+'px';
  cvs.width=Math.round(size*DPR); cvs.height=Math.round(size*DPR);
}
if(window.ResizeObserver){ new ResizeObserver(resize).observe(boardWrap); }
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,220); });

/* ---------- утилиты ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function occupied(x,y){
  for(var i=0;i<snake.length;i++) if(snake[i].x===x&&snake[i].y===y) return true;
  if(food&&food.x===x&&food.y===y) return true;
  if(golden&&golden.x===x&&golden.y===y) return true;
  return false;
}
function freeCell(){
  var tries=0;
  while(tries++<600){
    var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
    if(!occupied(x,y)) return {x:x,y:y};
  }
  return {x:0,y:0};
}

/* ---------- игра ---------- */
function reset(){
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir={x:1,y:0}; pending=[];
  score=0; eaten=0; speed=140; acc=0; particles=[]; golden=null;
  food=freeCell();
  updateHud();
}
function updateHud(){
  document.getElementById('hScore').textContent=score;
  document.getElementById('hBest').textContent=best;
}
function spawnGolden(){
  golden=freeCell();
  golden.expire=performance.now()+7000;
}
function burst(gx,gy,color){
  var c=(cvs.width/DPR)/COLS;
  var cx=gx*c+c/2, cy=gy*c+c/2;
  for(var i=0;i<14;i++){
    var a=Math.random()*Math.PI*2, sp=0.5+Math.random()*2.4;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}
function turn(x,y){
  var last = pending.length ? pending[pending.length-1] : dir;
  if(x===-last.x && y===-last.y) return;
  if(x===last.x && y===last.y) return;
  if(pending.length<2) pending.push({x:x,y:y});
}
function tick(){
  if(pending.length){
    var nd=pending.shift();
    if(!(nd.x===-dir.x && nd.y===-dir.y)) dir=nd;
  }
  var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};

  if(wrapMode){
    head.x=(head.x+COLS)%COLS;
    head.y=(head.y+ROWS)%ROWS;
  } else if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS){
    return gameOver();
  }

  var willGrow = !!(food && head.x===food.x && head.y===food.y);
  var body = willGrow ? snake : snake.slice(0, snake.length-1);
  for(var i=0;i<body.length;i++){
    if(body[i].x===head.x && body[i].y===head.y) return gameOver();
  }

  snake.unshift(head);

  if(willGrow){
    score+=10; eaten++;
    burst(head.x,head.y,'#7fd8ff');
    beep(620,0.08,'triangle',0.07);
    vibrate(14);
    speed=Math.max(72, 140-eaten*3);
    food=freeCell();
    if(eaten%5===0) spawnGolden();
  } else {
    snake.pop();
  }

  if(golden && head.x===golden.x && head.y===golden.y){
    score+=50;
    burst(golden.x,golden.y,'#e8c37a');
    beep(880,0.1,'square',0.055);
    setTimeout(function(){ beep(1180,0.13,'sine',0.05); },90);
    vibrate(28);
    golden=null;
  }

  updateHud();
}
function gameOver(){
  state='over';
  beep(200,0.28,'sawtooth',0.07);
  setTimeout(function(){ beep(130,0.35,'sawtooth',0.06); },140);
  vibrate([30,60,30]);
  var rec=false;
  if(score>best){ best=score; localStorage.setItem('ns_best',String(best)); rec=true; }
  updateHud();
  overScreen(rec);
}

/* ---------- отрисовка ---------- */
function drawFood(x,y,c,color,isGold){
  var cx=x*c+c/2, cy=y*c+c/2;
  var t=performance.now()/420;
  var pulse=1+Math.sin(t)*0.09;
  var r=c*0.29*pulse;
  ctx.save();
  ctx.shadowColor=color; ctx.shadowBlur=isGold?26:18;
  var g=ctx.createRadialGradient(cx-r*0.3,cy-r*0.35,r*0.15,cx,cy,r);
  if(isGold){ g.addColorStop(0,'#fff6dc'); g.addColorStop(.55,'#e8c37a'); g.addColorStop(1,'#a97c22'); }
  else { g.addColorStop(0,'#e8fbff'); g.addColorStop(.55,'#7fd8ff'); g.addColorStop(1,'#2b8fc4'); }
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
  if(isGold){
    ctx.save();
    ctx.globalAlpha=0.55+Math.sin(t*1.6)*0.25;
    ctx.strokeStyle='#f7e3b0'; ctx.lineWidth=Math.max(1,c*0.06);
    ctx.beginPath(); ctx.arc(cx,cy,r*1.55,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}
function draw(){
  var W=cvs.width/DPR, H=cvs.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  var c=W/COLS;

  ctx.strokeStyle='rgba(255,255,255,0.035)';
  ctx.lineWidth=1;
  for(var i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*c,0); ctx.lineTo(i*c,H); ctx.stroke(); }
  for(var j=1;j<ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*c); ctx.lineTo(W,j*c); ctx.stroke(); }

  if(food) drawFood(food.x,food.y,c,'#7fd8ff',false);
  if(golden) drawFood(golden.x,golden.y,c,'#e8c37a',true);

  var n=snake.length;
  for(var k=n-1;k>=0;k--){
    var s=snake[k];
    var p=n>1 ? k/(n-1) : 0;
    var hue=195-p*150;
    var light=58-p*13;
    ctx.save();
    if(k===0){ ctx.shadowColor='rgba(232,195,122,.95)'; ctx.shadowBlur=20; ctx.fillStyle='#f7e3b0'; }
    else { ctx.shadowColor='rgba(127,216,255,.35)'; ctx.shadowBlur=9; ctx.fillStyle='hsl('+hue+',85%,'+light+'%)'; }
    rr(s.x*c+1.6, s.y*c+1.6, c-3.2, c-3.2, Math.max(3,c*0.3));
    ctx.fill();
    ctx.restore();
  }

  if(n){
    var h=snake[0];
    var cx=h.x*c+c/2, cy=h.y*c+c/2;
    var ex=dir.x, ey=dir.y, px=-ey, py=ex;
    var off=c*0.19, fwd=c*0.13;
    for(var e=0;e<2;e++){
      var sgn=e===0?1:-1;
      var exx=cx+ex*fwd+px*off*sgn, eyy=cy+ey*fwd+py*off*sgn;
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(exx,eyy,Math.max(1.7,c*0.095),0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0b0d16';
      ctx.beginPath(); ctx.arc(exx+ex*c*0.03, eyy+ey*c*0.03, Math.max(1,c*0.048),0,Math.PI*2); ctx.fill();
    }
  }

  for(var q=0;q<particles.length;q++){
    var pt=particles[q];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,Math.max(1,c*0.07*pt.life),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx*dt*0.055; p.y+=p.vy*dt*0.055;
    p.vx*=0.985; p.vy*=0.985;
    p.life-=dt/620;
    if(p.life<=0) particles.splice(i,1);
  }
}

/* ---------- цикл ---------- */
function loop(t){
  rafId=requestAnimationFrame(loop);
  if(!lastT) lastT=t;
  var dt=t-lastT; lastT=t;
  if(dt>200) dt=200;

  if(state==='play'){
    acc+=dt;
    var guard=0;
    while(acc>=speed && guard++<6){
      acc-=speed;
      tick();
      if(state!=='play') break;
    }
    if(golden && performance.now()>golden.expire) golden=null;
  }
  updateParticles(dt);
  draw();
}

/* ---------- экраны ---------- */
function showOverlay(html){ ov.innerHTML=html; ov.classList.add('show'); }
function hideOverlay(){ ov.classList.remove('show'); ov.innerHTML=''; }

function menuScreen(){
  state='menu';
  showOverlay(
    '<div class="ov-card">'+
      '<div class="ov-logo">🐍</div>'+
      '<h1>NEXUS <span>Snake</span></h1>'+
      '<p class="ov-sub">Собирай яблоки, расти и не врезайся.<br>Золотое яблоко = <b style="color:#e8c37a">+50</b> очков.</p>'+
      '<div class="ov-row">'+
        '<button class="chip '+(wrapMode?'':'on')+'" id="mWalls">🧱 Стены</button>'+
        '<button class="chip '+(wrapMode?'on':'')+'" id="mPortal">🌀 Портал</button>'+
      '</div>'+
      '<div class="ov-row">'+
        '<button class="chip '+(soundOn?'on':'')+'" id="mSound">'+(soundOn?'🔊 Звук вкл':'🔇 Звук выкл')+'</button>'+
      '</div>'+
      '<button class="btn-primary" id="mPlay">Играть 🚀</button>'+
      '<p class="ov-hint">Свайп по полю · стрелки · WASD<br>Пробел — пауза · R — заново</p>'+
    '</div>'
  );
  ov.querySelector('#mWalls').onclick=function(){ wrapMode=false; localStorage.setItem('ns_mode','walls'); menuScreen(); };
  ov.querySelector('#mPortal').onclick=function(){ wrapMode=true; localStorage.setItem('ns_mode','portal'); menuScreen(); };
  ov.querySelector('#mSound').onclick=function(){ soundOn=!soundOn; localStorage.setItem('ns_sound',soundOn?'1':'0'); if(soundOn) beep(700,0.08,'sine',0.06); menuScreen(); };
  ov.querySelector('#mPlay').onclick=startGame;
}
function startGame(){
  reset();
  hideOverlay();
  state='play';
  acc=0; lastT=0;
  beep(520,0.09,'sine',0.06);
  setTimeout(function(){ beep(780,0.11,'sine',0.055); },100);
}
function pauseScreen(){
  state='pause';
  showOverlay(
    '<div class="ov-card">'+
      '<div class="ov-logo">⏸</div>'+
      '<h1>Пауза</h1>'+
      '<p class="ov-sub">Очки: <b style="color:#f7e3b0">'+score+'</b> · Длина: <b style="color:#7fd8ff">'+snake.length+'</b></p>'+
      '<button class="btn-primary" id="pRes">Продолжить ▶</button>'+
      '<button class="btn-ghost" id="pRestart">Начать заново 🔄</button>'+
      '<button class="btn-ghost" id="pMenu">В меню 🏠</button>'+
    '</div>'
  );
  ov.querySelector('#pRes').onclick=resumeGame;
  ov.querySelector('#pRestart').onclick=startGame;
  ov.querySelector('#pMenu').onclick=menuScreen;
}
function resumeGame(){
  hideOverlay();
  state='play';
  acc=0; lastT=0;
}
function overScreen(rec){
  showOverlay(
    '<div class="ov-card">'+
      '<div class="ov-logo">💀</div>'+
      '<h1>Игра окончена</h1>'+
      '<div class="big-score">'+score+'</div>'+
      '<p class="ov-sub" style="margin-top:2px">Длина змейки: '+snake.length+' · Рекорд: '+best+'</p>'+
      (rec?'<div class="rec">🏆 НОВЫЙ РЕКОРД!</div>':'')+
      '<button class="btn-primary" id="oAgain" style="margin-top:14px">Играть снова 🔄</button>'+
      '<button class="btn-ghost" id="oMenu">В меню 🏠</button>'+
    '</div>'
  );
  ov.querySelector('#oAgain').onclick=startGame;
  ov.querySelector('#oMenu').onclick=menuScreen;
}
function togglePause(){
  if(state==='play') pauseScreen();
  else if(state==='pause') resumeGame();
  else if(state==='menu'||state==='over') startGame();
}

/* ---------- управление ---------- */
var keyMap={
  ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
  'ц':[0,-1], 'ы':[0,1], 'ф':[-1,0], 'в':[1,0]
};
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '||k==='Spacebar'){ e.preventDefault(); togglePause(); return; }
  if(k==='r'||k==='R'||k==='к'||k==='К'){ startGame(); return; }
  var m=keyMap[k]||keyMap[k.toLowerCase()];
  if(m){ e.preventDefault(); if(state==='play') turn(m[0],m[1]); }
});

document.querySelectorAll('.pad button[data-dir]').forEach(function(b){
  b.addEventListener('pointerdown',function(ev){
    ev.preventDefault();
    if(state!=='play'){ if(state==='menu'||state==='over') startGame(); return; }
    var d=b.getAttribute('data-dir');
    if(d==='up') turn(0,-1);
    if(d==='down') turn(0,1);
    if(d==='left') turn(-1,0);
    if(d==='right') turn(1,0);
  });
});
document.getElementById('btnMid').addEventListener('click',togglePause);
document.getElementById('btnPause').addEventListener('click',togglePause);

/* свайпы */
var sx=0, sy=0, swiping=false;
boardWrap.addEventListener('touchstart',function(e){
  if(!e.touches.length) return;
  sx=e.touches[0].clientX; sy=e.touches[0].clientY; swiping=true;
},{passive:true});
boardWrap.addEventListener('touchmove',function(e){
  if(!swiping||!e.touches.length) return;
  var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
  if(Math.abs(dx)<26 && Math.abs(dy)<26) return;
  if(state==='play'){
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0);
    else turn(0,dy>0?1:-1);
  }
  swiping=false;
},{passive:true});
boardWrap.addEventListener('touchend',function(){ swiping=false; },{passive:true});

/* мышь-свайп для ПК */
var mdown=false;
boardWrap.addEventListener('mousedown',function(e){ mdown=true; sx=e.clientX; sy=e.clientY; });
window.addEventListener('mouseup',function(){ mdown=false; });
window.addEventListener('mousemove',function(e){
  if(!mdown||state!=='play') return;
  var dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)<30 && Math.abs(dy)<30) return;
  if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0);
  else turn(0,dy>0?1:-1);
  mdown=false;
});

document.addEventListener('visibilitychange',function(){
  if(document.hidden && state==='play') pauseScreen();
});

/* ---------- старт ---------- */
reset();
resize();
updateHud();
menuScreen();
rafId=requestAnimationFrame(loop);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      setInterval(function(){ reg.update(); }, 60000);
    }).catch(function(){});
  });
}
})();
</script>
</body>
</html>
