<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f1c"/>
      <stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3b0"/>
      <stop offset="0.55" stop-color="#e8c37a"/>
      <stop offset="1" stop-color="#c99a3f"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdf3ff"/>
      <stop offset="0.5" stop-color="#7fd8ff"/>
      <stop offset="1" stop-color="#2b8fc4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="rgba(232,195,122,.35)" stroke-width="4"/>

  <!-- тело змейки -->
  <g filter="url(#glow)" fill="url(#ice)">
    <rect x="118" y="330" width="76" height="76" rx="24"/>
    <rect x="182" y="330" width="76" height="76" rx="24"/>
    <rect x="246" y="330" width="76" height="76" rx="24"/>
    <rect x="246" y="266" width="76" height="76" rx="24"/>
    <rect x="246" y="202" width="76" height="76" rx="24"/>
    <rect x="182" y="202" width="76" height="76" rx="24"/>
  </g>

  <!-- голова -->
  <g filter="url(#glow)">
    <rect x="118" y="202" width="76" height="76" rx="24" fill="url(#gold)"/>
    <circle cx="142" cy="228" r="9" fill="#0b0d16"/>
    <circle cx="170" cy="228" r="9" fill="#0b0d16"/>
  </g>

  <!-- яблоко -->
  <g filter="url(#glow)">
    <circle cx="360" cy="150" r="34" fill="url(#ice)"/>
    <path d="M360 116 q10 -22 30 -26 q-4 22 -24 28 z" fill="#7fe0a0"/>
  </g>
</svg>
